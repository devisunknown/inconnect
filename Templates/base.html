<style>
    .neo-shadow { box-shadow: 5px 5px 0px 0px rgba(0,0,0,1); }
    .neo-shadow-sm { box-shadow: 3px 3px 0px 0px rgba(0,0,0,1); }
    .neo-shadow-hover:hover { transform: translate(2px, 2px); box-shadow: 3px 3px 0px 0px rgba(0,0,0,1); }
    .neo-shadow-active:active { transform: translate(5px, 5px); box-shadow: 0px 0px 0px 0px rgba(0,0,0,1); }
    .neo-border { border-width: 3px; border-color: #000000; border-style: solid; }
    .neo-input:focus { box-shadow: 5px 5px 0px 0px #4d44e3; }
    ::-webkit-scrollbar { display: none; }
    body { min-height: 100dvh; overflow-x: hidden; }
    body.chat-page { min-height: 0; height: 100dvh; overflow: hidden; }
    @supports (height: 100svh) {
        body.chat-page { height: 100svh; min-height: 100svh; }
    }

    /* ---- Page entry animation (mobile-optimized: transform/opacity only) ---- */
    @keyframes page-fade-up {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .page-enter { animation: page-fade-up 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* ---- Scroll reveal ---- */
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1); will-change: opacity, transform; }
    .reveal.revealed { opacity: 1; transform: translateY(0); }

    /* ---- Cross-document view transitions ---- */
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: vt-fade-out 0.16s ease both; }
    ::view-transition-new(root) { animation: vt-fade-in 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes vt-fade-out { to { opacity: 0; transform: translateY(-8px); } }
    @keyframes vt-fade-in { from { opacity: 0; transform: translateY(12px); } }

    /* ---- Respect reduced motion (mobile accessibility) ---- */
    @media (prefers-reduced-motion: reduce) {
        .page-enter, .reveal, ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; transition: none !important; }
        .reveal { opacity: 1; transform: none; }
    }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="bg-surface-off-white text-on-surface font-body-md {% block body_classes %}{% endblock %}">
{% block content %}{% endblock %}
{% if has_unverified_email %}
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md bg-primary-container text-white border-[3px] border-stroke-black rounded-xl neo-shadow p-4 z-[100] flex items-center gap-3">
    <span class="material-symbols-outlined shrink-0 text-2xl" style="font-variation-settings: 'FILL' 1;">mark_email_unread</span>
    <p class="flex-1 font-label-md text-label-md min-w-0">Verify your email to fully secure your account.</p>
    <form method="post" action="{% url 'resend_verification' %}">
        {% csrf_token %}
        <button type="submit" class="shrink-0 bg-neon-lime text-stroke-black border-2 border-stroke-black rounded-lg px-3 py-2 font-label-sm text-label-sm neo-shadow-sm hover:bg-vivid-yellow transition-colors">Resend</button>
    </form>
</div>
{% endif %}
<script>
    /* Scroll-reveal on load + scroll (mobile-optimized via rAF + IO) */
    (function () {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('revealed'); });
            return;
        }
        var els = Array.prototype.slice.call(document.querySelectorAll('.reveal:not(.revealed)'));
        if (!els.length) return;

        var revealedCount = 0;
        function reveal(el) {
            if (!el.classList.contains('revealed')) { el.classList.add('revealed'); revealedCount++; }
        }

        if (!('IntersectionObserver' in window)) {
            els.forEach(reveal);
            return;
        }

        var io = new IntersectionObserver(function (entries) {
            var ticking = false;
            function handle() {
                entries.forEach(function (entry) { if (entry.isIntersecting) reveal(entry.target); });
                if (revealedCount >= els.length) io.disconnect();
                ticking = false;
            }
            if (!ticking) { ticking = true; requestAnimationFrame(handle); }
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
        els.forEach(function (el) { io.observe(el); });
    })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
